name: GoonCord macOS build

# Manual only. Builds the macOS (universal) app and uploads it as a workflow artifact.
# Does not publish a release.
on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    macos:
        runs-on: macos-latest

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm build

            # Output into the repo (not ../Build, which is outside the CI workspace).
            # Signing is used only if the Apple secrets are set; otherwise the app is unsigned.
            - name: Package macOS app
              run: pnpm electron-builder --mac --config.directories.output=Build
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  CSC_LINK: ${{ secrets.APPLE_SIGNING_CERT }}
                  CSC_KEY_PASSWORD: ${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}
                  CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.APPLE_SIGNING_CERT != '' && 'true' || 'false' }}
                  APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
                  APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

            - name: Upload macOS artifact
              uses: actions/upload-artifact@v4
              with:
                  name: GoonCord-macOS
                  path: |
                      Build/*.dmg
                      Build/*.zip
                  if-no-files-found: error
